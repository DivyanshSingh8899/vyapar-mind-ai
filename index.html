<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paytm Vyapar-Mind — turning the Paytm Soundbox from a passive payment speaker into a two-way AI business operator. Hackathon prototype with simulated data."
    />
    <meta name="theme-color" content="#eef3fc" />
    <title>Paytm Vyapar-Mind — AI Business Operator</title>
    <script>
      // Boot error trap: paint module-load crashes on screen instead of a
      // silent white page (the dev overlay is disabled in this environment).
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-error");
        if (!el && document.body) {
          el = document.createElement("pre");
          el.id = "boot-error";
          el.style.cssText =
            "position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
          (document.body).appendChild(el);
        }
        if (el) el.textContent += "[boot error] " + (e.message || e.type) + "\n" + (e.filename || "") + ":" + (e.lineno || 0) + "\n";
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-error");
        if (!el && document.body) {
          el = document.createElement("pre");
          el.id = "boot-error";
          el.style.cssText =
            "position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
          (document.body).appendChild(el);
        }
        if (el) el.textContent += "[promise] " + String(e.reason && e.reason.message ? e.reason.message : e.reason) + "\n";
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
